name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          args: >
            --github_user_name ${{ github.repository_owner }}
            --save_svg
            --palette github-dark
            --palette github-light
            --gif_out_path ./dist/github-contribution-grid-snake.gif
            --svg_out_path ./dist/github-contribution-grid-snake.svg

      - name: Push dist to output branch
        run: |
          cd dist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git init
          git checkout -b output
          git add .
          git commit -m "Update snake animation" --allow-empty
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git output